<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Gallery of high resolution artwork.">
  <title>Image Gallery</title>
  <link rel="stylesheet" href="style-snow.css">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
  <script src="script-snow.js" defer></script>
</head>
<body>
  <div id="snow" aria-hidden="true"></div>
  <main class="page-content">
    <button id="music-toggle" type="button" aria-label="Mute artwork audio" aria-pressed="false">♫</button>
    <header class="gallery-header">
      <p class="eyebrow">ARTWORK &amp; EDITS</p>
      <h1>Image Gallery</h1>
      <p class="intro">High resolution artwork usable as wallpapers</p>
    </header>
    <section id="gallery" class="gallery" aria-label="Artwork"></section>
    <p class="footer-note">Select an image to view it full size.</p>
  </main>
  <dialog id="viewer" aria-label="Artwork viewer">
    <div class="viewer-frame">
      <button class="viewer-close" type="button" aria-label="Close image">×</button>
      <div class="viewer-image-wrap"><img id="viewer-image" alt=""></div>
      <div class="viewer-info">
        <div class="viewer-title-wrap"><h2 id="viewer-title"></h2></div>
        <div class="viewer-actions">
          <a id="download-link" class="download-button" download>Download image</a>
          <a id="instagram-link" class="download-button instagram-button" target="_blank" rel="noopener noreferrer">Watch Instagram video</a>
        </div>
      </div>
    </div>
  </dialog>
</body>
</html>
